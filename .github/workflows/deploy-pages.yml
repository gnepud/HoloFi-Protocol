name: Deploy Architecture Diagram to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/system_architecture_diagram.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages Artifact
        run: |
          mkdir -p _site
          cp docs/system_architecture_diagram.html _site/index.html
          cp docs/system_architecture_diagram.html _site/system_architecture_diagram.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
